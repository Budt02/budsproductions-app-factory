<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>QuickQuote Pro — Supabase</title>

<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface2:#eef2f7;--text:#172033;--muted:#667085;
  --border:#d9dee8;--primary:#2457e6;--primary-dark:#1944bd;--success:#16834b;
  --warning:#a86700;--danger:#c93636;--radius:14px;--shadow:0 8px 28px rgba(20,32,55,.08);
  --sidebar:240px;--focus:0 0 0 3px rgba(36,87,230,.22)
}
*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none;box-shadow:var(--focus);border-color:var(--primary)}
.app{min-height:100vh}.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:#111827;color:#e5e7eb;padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:20}
.brand{font-weight:800;font-size:20px;padding:8px 12px 24px;letter-spacing:-.3px}.brand span{color:#8fb0ff}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px;border-radius:10px;font-weight:600}.nav button:hover,.nav button.active{background:#26334a;color:white}
.sidebar-bottom{position:absolute;bottom:18px;left:14px;right:14px}.logout{width:100%;border:0;background:#1f2937;color:#cbd5e1;padding:11px;border-radius:10px}
.main{margin-left:var(--sidebar);width:calc(100% - var(--sidebar));min-width:0}.topbar{height:66px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.mobile-brand{display:none;font-weight:800}.mobile-menu{display:none}.mobile-drawer-backdrop{display:none}.mobile-drawer{display:none}.content{padding:28px;max-width:1240px;margin:auto}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.7px}h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 24px}.grid{display:grid;gap:18px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.stat{padding:18px}.stat .label{color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.stat .value{font-size:26px;font-weight:800;margin-top:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.actions{display:flex;flex-wrap:wrap;gap:10px}.btn{border:1px solid var(--border);background:white;color:var(--text);padding:10px 14px;border-radius:10px;font-weight:700}.btn:hover{background:var(--surface2)}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.btn.primary:hover{background:var(--primary-dark)}.btn.danger{color:white;background:var(--danger);border-color:var(--danger)}.btn.ghost{border-color:transparent;background:transparent}.btn:disabled{opacity:.55;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.badge.draft{background:#eef1f5;color:#596273}.badge.sent{background:#eaf0ff;color:#2457e6}.badge.viewed{background:#eeeafd;color:#6246c7}.badge.approved{background:#e7f7ef;color:var(--success)}.badge.declined,.badge.expired{background:#fdecec;color:var(--danger)}
.list{display:grid;gap:10px}.list-item{border:1px solid var(--border);border-radius:12px;padding:15px;background:white;display:flex;justify-content:space-between;gap:15px;align-items:center}.list-item.clickable{cursor:pointer}.list-item.clickable:hover{border-color:#aeb9ce}
label{display:grid;gap:6px;font-weight:700;font-size:13px}.field{display:grid;gap:14px}input,textarea,select{width:100%;border:1px solid var(--border);background:white;border-radius:10px;padding:11px 12px;color:var(--text)}textarea{min-height:100px;resize:vertical}.help{font-size:12px;color:var(--muted);font-weight:500}.error{font-size:12px;color:var(--danger);font-weight:700}.required::after{content:" *";color:var(--danger)}
.search{position:relative}.search input{padding-left:38px}.search:before{content:"⌕";position:absolute;left:13px;top:8px;color:var(--muted);font-size:22px;z-index:1}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.estimate-total{font-size:34px;font-weight:900;letter-spacing:-1px}.divider{border:0;border-top:1px solid var(--border);margin:18px 0}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid var(--border);text-align:left}.table th{font-size:12px;text-transform:uppercase;color:var(--muted)}.right{text-align:right!important}
.stepper{display:flex;gap:8px;margin-bottom:22px;overflow:auto}.step{padding:8px 11px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:800;font-size:12px;white-space:nowrap}.step.active{background:#eaf0ff;color:var(--primary)}
.empty{text-align:center;padding:44px 18px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:13px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:100;max-width:360px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);display:grid;place-items:center;padding:18px;z-index:80}.modal{background:white;border-radius:16px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.22)}
.public{max-width:760px;margin:30px auto;padding:0 18px}.public .card{box-shadow:0 12px 40px rgba(20,32,55,.1)}
.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.auth-card{width:min(430px,100%);background:white;border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:var(--shadow)}.auth-brand{text-align:center;font-size:25px;font-weight:900;margin-bottom:24px}.auth-brand span{color:var(--primary)}
.logo-preview{width:72px;height:72px;border-radius:12px;border:1px dashed var(--border);display:grid;place-items:center;overflow:hidden;background:var(--surface2)}.logo-preview img{width:100%;height:100%;object-fit:cover}
.notice{padding:12px 14px;border-radius:10px;background:#eef5ff;color:#244a9b;font-size:13px}.danger-box{padding:12px 14px;border-radius:10px;background:#fff0f0;color:#9d2929;font-size:13px}
.mobile-bottom{display:none}
@media(max-width:900px){
.mobile-drawer-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.mobile-drawer-backdrop.open{opacity:1;pointer-events:auto}
.mobile-drawer{display:flex;position:fixed;top:0;left:0;bottom:0;width:min(82vw,330px);background:var(--surface);z-index:100;transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:18px;flex-direction:column;gap:8px}
.mobile-drawer.open{transform:translateX(0)}
.mobile-drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:6px;font-size:18px}
.mobile-drawer>button{border:0;background:transparent;text-align:left;padding:14px 12px;border-radius:10px;font-size:15px;font-weight:800;color:var(--text)}
.mobile-drawer>button:active,.mobile-drawer>button:hover{background:var(--soft)}
.mobile-drawer .drawer-logout{margin-top:auto;background:#1f2937;color:#fff;text-align:center}
.sidebar{display:none}.main{margin-left:0;width:100%}.mobile-menu{display:inline-flex}.mobile-brand{display:block}.topbar{padding:0 16px}.content{padding:20px 16px}.grid-3{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}.mobile-bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);z-index:30;padding:6px;justify-content:space-around}.mobile-bottom button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:800;padding:8px}.mobile-bottom button.active{color:var(--primary)}.content{padding-bottom:88px}}
@media(max-width:620px){h1{font-size:25px}.grid-2{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}.card{padding:16px}.actions .btn{flex:1;min-width:130px}.list-item{align-items:flex-start}.estimate-total{font-size:28px}.table-wrap{overflow:auto}.topbar{height:58px}}
@media(max-width:420px){.kpi{grid-template-columns:1fr}.actions .btn{width:100%;flex:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*
  QUICKQUOTE PRO — SINGLE-FILE FRONT END
  --------------------------------------
  Component tree:
    App
    ├─ Auth (Login / Signup)
    ├─ AppShell
    │  ├─ Sidebar / MobileNav
    │  ├─ Topbar
    │  └─ Screen
    │     ├─ Dashboard
    │     ├─ Customers / CustomerDetails
    │     ├─ EstimateList
    │     ├─ EstimateWizard
    │     ├─ EstimateDetails / Preview
    │     ├─ Services
    │     └─ Settings
    └─ PublicEstimate

  BACKEND PLUG-IN POINTS are marked "BACKEND:" below.
  Replace localStorage functions with API/database calls when ready.
*/

const STORAGE_KEY = "quickquote-pro-demo-v1";

const seed = {
  user: null,
  business: {
    name:"Your Business Name", phone:"936-555-1234", email:"you@example.com",
    address:"", website:"", license:"", logo:"", taxRate:8.25, markup:20,
    terms:"Payment due according to agreed terms. Estimate valid until the expiration date."
  },
  customers: [
    {id:"c1",first:"John",last:"Smith",phone:"936-555-1001",email:"john@example.com",address:"123 Main Street",notes:""},
    {id:"c2",first:"Mike",last:"Jones",phone:"936-555-1002",email:"",address:"456 Oak Street",notes:""}
  ],
  services: [
    {id:"s1",name:"Water Heater Replacement",description:"Replace existing water heater.",labor:650,material:900,markup:20,taxable:true},
    {id:"s2",name:"Faucet Installation",description:"Install faucet and test connections.",labor:175,material:50,markup:20,taxable:true},
    {id:"s3",name:"Fence Repair",description:"Repair damaged fence section.",labor:450,material:175,markup:20,taxable:true}
  ],
  estimates: [
    {id:"e1",number:"EST-1001",customerId:"c1",title:"Water Heater Replacement",address:"123 Main Street",description:"Replace existing water heater.",expiration:"2026-10-09",status:"Approved",
      items:[{description:"Water Heater",qty:1,unit:"Job",labor:650,material:900,markup:20,taxable:true},{description:"Installation Labor",qty:1,unit:"Job",labor:0,material:0,markup:0,taxable:true,flat:650}],
      createdAt:"2026-09-24T12:00:00",approvedAt:"2026-09-24T15:00:00"},
    {id:"e2",number:"EST-1002",customerId:"c2",title:"Fence Repair",address:"456 Oak Street",description:"Repair damaged fence section.",expiration:"2026-10-10",status:"Sent",
      items:[{description:"Fence Repair",qty:1,unit:"Job",labor:450,material:175,markup:20,taxable:true}],
      createdAt:"2026-09-25T09:00:00"}
  ],
  settings:{prefix:"EST",startingNumber:1003,defaultExpiration:14},
  nextNumber:1003
};

let state = loadState();
let view = state.user ? "dashboard" : "login";
let selectedCustomerId = null;
let selectedEstimateId = null;
let publicToken = new URLSearchParams(location.search).get("estimate");
let publicLoaded = false;
let publicData = null;
let customerSearch = "";
let estimateSearch = "";
let currentWizardStep = 1;
let draft = null;
let toastTimer = null;

const SUPABASE_URL = "https://evkexulkxrvtisrhaohj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_C0jfubBEvzZAKRlfkegByA_uVQkwMTh";
const ACCOUNT_DELETION_URL = "https://steady-sorbet-7330e1.netlify.app/account-deletion.html";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let supabaseReady = false;
let saveTimer = null;

function loadState(){ return structuredClone(seed); }

async function saveState(){
  if(!supabaseReady) return;
  const {data:{user}} = await supabaseClient.auth.getUser();
  if(!user) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const payload={...state, user:{id:user.id,email:user.email}};
    const {error}=await supabaseClient.from("app_data").upsert({user_id:user.id,data:payload,updated_at:new Date().toISOString()},{onConflict:"user_id"});
    if(error) console.error("Supabase save error:",error);
  },120);
}

async function loadCloudState(user){
  const {data,error}=await supabaseClient.from("app_data").select("data").eq("user_id",user.id).maybeSingle();
  if(error){ console.error(error); showToast("Could not load your cloud data."); return; }
  if(data?.data){
    state=Object.assign(structuredClone(seed),data.data,{user:{id:user.id,email:user.email}});
  }else{
    state=structuredClone(seed);
    state.user={id:user.id,email:user.email};
    await saveState();
  }
}

async function bootstrapSupabase(){
  supabaseReady=true;

  // Public customer estimate route: quickquote_pro_frontend.html?estimate=PUBLIC_TOKEN
  if(publicToken){
    view="public";
    render();
    await loadPublicEstimate(publicToken);
    return;
  }

  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session?.user){
    await loadCloudState(session.user);
    view=state.business?.name && state.business.name!==seed.business.name ? "dashboard" : "setup";
  }else{
    state=structuredClone(seed);
    state.user=null;
    view="login";
  }
  render();
  supabaseClient.auth.onAuthStateChange(async(event,session)=>{
    if(event==="SIGNED_OUT"){ state=structuredClone(seed);state.user=null;view="login";render();return; }
    if(event==="SIGNED_IN" && session?.user){
      await loadCloudState(session.user);
      view=state.business?.name && state.business.name!==seed.business.name ? "dashboard" : "setup";
      render();
    }
  });
}

async function publishEstimate(id){
  const e=getEstimate(id);
  if(!e) return null;
  if(!e.publicToken) e.publicToken=crypto.randomUUID().replaceAll("-","");
  const payload={
    estimate:e,
    business:state.business,
    customer:getCustomer(e.customerId)||null,
    settings:state.settings
  };
  const {error}=await supabaseClient.from("public_estimates").upsert({
    token:e.publicToken,
    owner_user_id:state.user?.id || null,
    payload,
    status:e.status || "Sent",
    updated_at:new Date().toISOString()
  },{onConflict:"token"});
  if(error){console.error(error);showToast("Could not create customer link: "+error.message);return null;}
  return e.publicToken;
}

async function loadPublicEstimate(token){
  const {data,error}=await supabaseClient.rpc("get_public_estimate",{p_token:token});
  if(error || !data){
    console.error(error);
    publicLoaded=true;
    publicData=null;
    render();
    return;
  }
  publicData=data;
  publicLoaded=true;
  render();
}

async function approvePublicEstimate(token){
  const name=document.getElementById("publicSignName")?.value.trim();
  const signature=document.getElementById("publicSignature")?.value.trim();
  const terms=document.getElementById("publicTerms")?.checked;
  if(!name || !signature || !terms){
    showToast("Enter your name, signature, and accept the terms.");
    return;
  }
  const {data,error}=await supabaseClient.rpc("approve_public_estimate",{
    p_token:token,p_name:name,p_signature:signature
  });
  if(error){console.error(error);showToast(error.message);return;}
  publicData=data;
  closeApproval();
  render();
  showToast("Estimate approved.");
}

async function declinePublicEstimate(token){
  const reason=prompt("Would you like to tell us why you're declining this estimate?")||"";
  const {data,error}=await supabaseClient.rpc("decline_public_estimate",{
    p_token:token,p_reason:reason
  });
  if(error){console.error(error);showToast(error.message);return;}
  publicData=data;
  render();
  showToast("Estimate declined.");
}
function uid(prefix="id"){ return prefix+"_"+Math.random().toString(36).slice(2,10); }
function money(n){ return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0); }
function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function customerName(c){return [c?.first,c?.last].filter(Boolean).join(" ") || "Unnamed Customer";}
function getCustomer(id){return state.customers.find(c=>c.id===id);}
function getEstimate(id){return state.estimates.find(e=>e.id===id);}
function calcItem(i){
  if(i.flat!=null) return Number(i.flat)||0;
  const base=(Number(i.labor)||0)+(Number(i.material)||0);
  return base*(1+(Number(i.markup)||0)/100)*(Number(i.qty)||1);
}
function calcEstimate(e){
  const subtotal=e.items.reduce((s,i)=>s+calcItem(i),0);
  const taxable=e.items.filter(i=>i.taxable).reduce((s,i)=>s+calcItem(i),0);
  const tax=taxable*(Number(state.business.taxRate)||0)/100;
  return {subtotal,taxable,tax,total:subtotal+tax};
}
function statusClass(s){return String(s).toLowerCase();}
function showToast(msg){clearTimeout(toastTimer);toast(msg);toastTimer=setTimeout(()=>{const x=document.querySelector(".toast");if(x)x.remove()},3200)}
function toast(msg){document.body.insertAdjacentHTML("beforeend",`<div class="toast" role="status">${esc(msg)}</div>`)}
function toggleMobileMenu(){
  const drawer=document.getElementById("mobileDrawer"),back=document.getElementById("mobileDrawerBackdrop");
  if(!drawer||!back)return;
  const open=drawer.classList.toggle("open"); back.classList.toggle("open",open);
}
function mobileNav(v){toggleMobileMenu();setView(v);}
function setView(v){view=v; render(); window.scrollTo({top:0,behavior:"smooth"});}
function navButton(v,label,icon){return `<button class="${view===v?'active':''}" onclick="setView('${v}')">${icon} ${label}</button>`}

function shell(content,title="QuickQuote Pro"){
  return `<div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">Quick<span>Quote</span> Pro</div>
      <nav class="nav">
        ${navButton("dashboard","Home","⌂")}
        ${navButton("estimates","Estimates","▤")}
        ${navButton("customers","Customers","♙")}
        ${navButton("services","Services","◆")}
        ${navButton("settings","Settings","⚙")}
      </nav>
      <div class="sidebar-bottom"><button class="logout" onclick="logout()">Log out</button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn ghost mobile-menu" onclick="toggleMobileMenu()" aria-label="Open menu">☰</button>
        <div class="mobile-brand">Quick<span style="color:var(--primary)">Quote</span></div>
        <div></div>
        <button class="btn primary" onclick="startEstimate()">+ New Estimate</button>
      </header>
      <div class="content">${content}</div>
      <div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop" onclick="toggleMobileMenu()"></div>
      <aside id="mobileDrawer" class="mobile-drawer" aria-label="Mobile menu">
        <div class="mobile-drawer-head"><strong>QuickQuote Pro</strong><button class="btn ghost" onclick="toggleMobileMenu()" aria-label="Close menu">✕</button></div>
        <button onclick="mobileNav('dashboard')">⌂ Home</button>
        <button onclick="mobileNav('estimates')">▤ Estimates</button>
        <button onclick="mobileNav('customers')">♙ Customers</button>
        <button onclick="mobileNav('services')">◆ Services</button>
        <button onclick="mobileNav('settings')">⚙ Settings</button>
        <button class="drawer-logout" onclick="toggleMobileMenu();logout()">Log out</button>
      </aside>
      <nav class="mobile-bottom" aria-label="Mobile navigation">
        ${navButton("dashboard","Home","⌂")}${navButton("estimates","Estimates","▤")}${navButton("customers","Customers","♙")}${navButton("services","Services","◆")}${navButton("settings","More","⋯")}
      </nav>
    </main>
  </div>`;
}

function render(){
  const root=document.getElementById("app");
  if(view==="login"||view==="signup"){root.innerHTML=authScreen(view);return;}
  if(view==="public"){root.innerHTML=publicEstimate(selectedEstimateId);return;}
  let content="";
  switch(view){
    case "dashboard":content=dashboard();break;
    case "customers":content=customers();break;
    case "customer":content=customerDetails(selectedCustomerId);break;
    case "estimates":content=estimates();break;
    case "wizard":content=wizard();break;
    case "estimate":content=estimateDetails(selectedEstimateId);break;
    case "preview":content=preview(selectedEstimateId);break;
    case "services":content=services();break;
    case "settings":content=settings();break;
    default:content=dashboard();
  }
  root.innerHTML=shell(content);
}

function authScreen(mode){
  const signup=mode==="signup";
  return `<main class="auth"><section class="auth-card" aria-labelledby="auth-title">
    <div class="auth-brand">Quick<span>Quote</span> Pro</div>
    <h1 id="auth-title" style="font-size:24px">${signup?"Create your account":"Welcome back"}</h1>
    <p class="sub">${signup?"Create professional estimates in minutes.":"Sign in to manage your estimates."}</p>
    <form class="stack" onsubmit="handleAuth(event,'${signup?'signup':'login'}')">
      ${signup?`<label class="required">Email<input id="authEmail" type="email" autocomplete="email" required></label>
      <label class="required">Password<input id="authPass" type="password" minlength="8" autocomplete="new-password" required></label>
      <label class="required">Confirm password<input id="authConfirm" type="password" minlength="8" autocomplete="new-password" required></label>`:
      `<label class="required">Email<input id="authEmail" type="email" autocomplete="email" required></label>
      <label class="required">Password<input id="authPass" type="password" autocomplete="current-password" required></label>`}
      <button class="btn primary" type="submit">${signup?"Create Account":"Log In"}</button>
    </form>
    <div style="margin-top:18px;text-align:center;font-size:13px;color:var(--muted)">
      ${signup?`Already have an account? <button class="btn ghost" onclick="setView('login')">Log in</button>`:
      `Don't have an account? <button class="btn ghost" onclick="setView('signup')">Create account</button>`}
    </div>
  </section></main>`;
}
async function handleAuth(ev,mode){
  ev.preventDefault();
  const email=document.getElementById("authEmail").value.trim();
  const pass=document.getElementById("authPass").value;
  if(!email||!pass){showToast("Enter your email and password.");return;}
  if(mode==="signup"){
    const confirm=document.getElementById("authConfirm").value;
    if(pass!==confirm){showToast("Passwords don't match.");return;}
    if(pass.length<8){showToast("Password must be at least 8 characters.");return;}
    const {data,error}=await supabaseClient.auth.signUp({email,password:pass});
    if(error){showToast(error.message);return;}
    if(data.session){
      state=structuredClone(seed);state.user={email};await saveState();setView("setup");
      showToast("Account created. Let's set up your business.");
    }else{
      setView("login");
      showToast("Account created. Check your email to confirm your account, then log in.");
    }
  }else{
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
    if(error){showToast(error.message);return;}
    state.user={email};
    await loadCloudState(data.user);
    view=state.business?.name && state.business.name!==seed.business.name ? "dashboard" : "setup";
    render();
    showToast("Signed in.");
  }
}

function pdfAscii(v=""){
  return String(v??"").replace(/[^\x20-\x7E]/g,"?").replace(/\\/g,"\\\\").replace(/[()]/g,m=>"\\"+m);
}
function pdfWrap(text,max=88){
  const words=String(text??"").split(/\\s+/),out=[];let line="";
  for(const word of words){
    if(!word)continue;
    const next=line?line+" "+word:word;
    if(next.length>max){if(line)out.push(line);line=word;}else line=next;
  }
  if(line)out.push(line);
  return out.length?out:[""];
}
function buildEstimatePdf(e,c,t,b){
  const lines=[];
  lines.push(b.name||"QuickQuote Pro");
  if(b.phone)lines.push("Phone: "+b.phone);
  if(b.email)lines.push("Email: "+b.email);
  if(b.address)lines.push("Address: "+b.address);
  lines.push("");
  lines.push("ESTIMATE "+e.number);
  lines.push("Date: "+new Date(e.createdAt).toLocaleDateString()+"   Valid until: "+(e.expiration||""));
  lines.push("Customer: "+customerName(c));
  if(c?.phone)lines.push("Phone: "+c.phone);
  if(c?.email)lines.push("Email: "+c.email);
  if(c?.address)lines.push("Address: "+c.address);
  lines.push("");
  lines.push(e.title||"Estimate");
  for(const part of pdfWrap(e.description||""))lines.push(part);
  lines.push("");
  lines.push("ITEMS");
  lines.push("Description                         Qty       Amount");
  for(const item of (e.items||[])){
    const desc=String(item.description||"Item").slice(0,32).padEnd(34," ");
    const qty=String(item.qty??1).padStart(3," ");
    const amount=money(calcItem(item)).padStart(14," ");
    lines.push(desc+" "+qty+" "+amount);
  }
  lines.push("");
  lines.push("Subtotal: "+money(t.subtotal));
  lines.push("Tax:      "+money(t.tax));
  lines.push("TOTAL:    "+money(t.total));
  if(b.terms){
    lines.push("");
    lines.push("TERMS");
    for(const part of String(b.terms).split(/\\r?\n/))for(const w of pdfWrap(part))lines.push(w);
  }
  const pages=[];
  const perPage=48;
  for(let i=0;i<lines.length;i+=perPage)pages.push(lines.slice(i,i+perPage));
  const objs=[];
  objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
  objs[2]=null;
  objs[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>";
  const kids=[];
  for(const pageLines of pages){
    const content=["BT","/F1 10 Tf","50 750 Td","14 TL"];
    pageLines.forEach((line,idx)=>{
      if(idx)content.push("T*");
      content.push("("+pdfAscii(line)+") Tj");
    });
    content.push("ET");
    const stream=content.join("\n");
    const contentId=objs.length;
    objs.push("<< /Length "+stream.length+" >>\nstream\n"+stream+"\nendstream");
    const pageId=objs.length;
    objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R >> >> /Contents "+contentId+" 0 R >>");
    kids.push(pageId);
  }
  objs[2]="<< /Type /Pages /Kids ["+kids.map(id=>id+" 0 R").join(" ")+"] /Count "+kids.length+" >>";
  let pdf="%PDF-1.4\n%1234\n",offsets=[0];
  for(let i=1;i<objs.length;i++){offsets[i]=pdf.length;pdf+=i+" 0 obj\n"+objs[i]+"\nendobj\n";}
  const xref=pdf.length;
  pdf+="xref\n0 "+objs.length+"\n0000000000 65535 f \n";
  for(let i=1;i<objs.length;i++)pdf+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  pdf+="trailer\n<< /Size "+objs.length+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  return new TextEncoder().encode(pdf);
}
function bytesToBase64(bytes){
  let binary="";const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  return btoa(binary);
}
async function downloadEstimate(id){
  const e=getEstimate(id);if(!e)return;
  const c=getCustomer(e.customerId),t=calcEstimate(e),b=state.business||{};
  try{
    const bytes=buildEstimatePdf(e,c,t,b);
    const filename=(e.number||"Estimate")+".pdf";
    const cap=window.Capacitor;
    const fs=cap?.Plugins?.Filesystem, share=cap?.Plugins?.Share;
    if(cap?.isNativePlatform?.() && fs){
      const result=await fs.writeFile({path:filename,data:bytesToBase64(bytes),directory:"CACHE",recursive:true});
      if(share){
        await share.share({title:"Estimate "+(e.number||""),text:"QuickQuote Pro estimate",files:[result.uri]});
        showToast("PDF ready to share/save.");
        return;
      }
    }
    const blob=new Blob([bytes],{type:"application/pdf"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    showToast("PDF downloaded.");
  }catch(err){
    console.error("PDF generation failed",err);
    showToast("PDF could not be created. Please try again.");
  }
}

async function requestAccountDeletion(){
  const email=state.user?.email||"";
  if(!email){showToast("No signed-in account found.");return;}
  if(!confirm("Delete your QuickQuote cloud data and start the account deletion request? This cannot be undone."))return;
  try{
    const {data:{user}}=await supabaseClient.auth.getUser();
    if(!user){showToast("Please sign in again before deleting your account.");return;}
    const {error}=await supabaseClient.from("app_data").delete().eq("user_id",user.id);
    if(error)throw error;
    state=structuredClone(seed);
    state.user=null;
    await supabaseClient.auth.signOut();
    const subject=encodeURIComponent("QuickQuote Pro account deletion request");
    const body=encodeURIComponent("Please permanently delete my QuickQuote Pro account and any remaining account-associated data.\n\nAccount email: "+email+"\nUser ID: "+user.id);
    location.href="mailto:buddyteasdale@gmail.com?subject="+subject+"&body="+body;
  }catch(err){
    console.error("Account deletion failed",err);
    showToast("Could not delete your stored app data. Please use the Account deletion page.");
  }
}
async function resetDemo(){if(!confirm("Reset your QuickQuote data to the sample data?"))return;const {data:{user}}=await supabaseClient.auth.getUser();if(!user)return;state=structuredClone(seed);state.user={email:user.email};await saveState();setView("dashboard");showToast("Sample data restored.");}
