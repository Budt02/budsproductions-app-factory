name: Build QuickQuote Pro release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set Play target API 36
        working-directory: android
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("variables.gradle")
          s = p.read_text()
          s = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
          s = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
          p.write_text(s)
          PY

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Configure release signing
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          cat > keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          if "keystore.properties" not in s:
              s = "import java.util.Properties\n\n" + s
              s = s.replace(
                  "android {",
                  """def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {""",
                  1
              )
          if "signingConfigs" not in s:
              s = s.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          storeFile file(keystoreProperties["storeFile"])
                          storePassword keystoreProperties["storePassword"]
                          keyAlias keystoreProperties["keyAlias"]
                          keyPassword keystoreProperties["keyPassword"]
                      }
                  }
              }""",
                  1
              )
          if "signingConfig signingConfigs.release" not in s:
              import re
              s = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  s,
                  count=1
              )
          p.write_text(s)
          PY

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify AAB exists
        run: test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: QuickQuote-Pro-release
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/keystore.properties
